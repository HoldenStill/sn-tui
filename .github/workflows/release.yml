name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package asset (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/sn-tui"
          PKG_NAME="sn-tui-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "${BIN_PATH}" "dist/${PKG_NAME}/sn-tui"
          cp LICENSE "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"
          tar -C dist -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package asset (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $BinPath = "target/${{ matrix.target }}/release/sn-tui.exe"
          $PkgName = "sn-tui-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$PkgName" -Force | Out-Null
          Copy-Item $BinPath "dist/$PkgName/sn-tui.exe"
          Copy-Item LICENSE "dist/$PkgName/"
          Copy-Item README.md "dist/$PkgName/"
          Compress-Archive -Path "dist/$PkgName" -DestinationPath "${PkgName}.zip"
          $Hash = (Get-FileHash -Path "${PkgName}.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  ${PkgName}.zip" | Out-File -Encoding ascii "${PkgName}.zip.sha256"

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            sn-tui-${{ matrix.target }}.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: release-assets

      - name: Generate combined checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
