[package]
name = "sn-tui"
version = "0.1.0"
edition = "2024"
authors = ["Holden Anderson"]
description = "Lean terminal-native Supernote .note/.mark/PDF viewer, exporter, and Cloud/Private Cloud sync manager"
license = "MIT"
repository = "https://github.com/HoldenStill/sn-tui"
readme = "README.md"
keywords = ["supernote", "ratatui", "tui", "e-ink", "pdf"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
flate2 = "1.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }
lopdf = { version = "0.47", default-features = false }
lru = "0.16"
md-5 = "0.10"
notify = "8.2"
quick-xml = "0.39"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "1.0"
ureq = { version = "3.5", default-features = false, features = ["json", "rustls", "gzip"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
